services:
  db:
    image: postgres:16-alpine
    container_name: movescout-postgres
    environment:
      POSTGRES_USER: movescout
      POSTGRES_PASSWORD: movescout
      POSTGRES_DB: movescout_dev
    ports:
      - "5432:5432"
    volumes:
      - movescout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movescout -d movescout_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  movescout_pgdata:

